<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="3.css">
    <title>Document</title>
</head>
<body>
    <section>
        <h2>js animation</h2>
        <div class="banner">
        </div>
    </section>
    <script>
        const banner = document.querySelector(".banner");
        const blocks = document.createDocumentFragment();
        const columns = 20;
        const blockStagger = 0.005;
        let rowStart = 0;
        for (let i = 0; i < 400; i++) {
            const block = document.createElement("div");
            block.className = "block";
            const row = Math.floor(i / columns);
            const column = i % columns;
            const blockDuration = 0.1 + row * 0.01;
            block.style.animationDuration = `${blockDuration}s`;
            block.style.animationDelay = `${rowStart + column * blockStagger}s`;
            if (column === columns - 1) {
                rowStart += blockDuration + (columns - 1) * blockStagger;
            }
            blocks.append(block);
        }
        banner.append(blocks);
    </script>
</body>
</html>
